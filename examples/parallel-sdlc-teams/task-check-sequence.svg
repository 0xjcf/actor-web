<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc">
  <title id="title">Who can advance a task from Test to Review?</title>
  <desc id="desc">Time runs down the page. For one pinned Test attempt, the task actor authorizes the team; its specialist asks the executor host to run a bounded guest check. The guest reports to its host. The host records the receipt but disconnects before delivering it. On receipt timeout, the task actor holds the attempt as unknown. Reconnection permits reading the existing receipt, not dispatching another check. A matching host receipt, on time or late, moves the task to reviewReady for a pass or checkFailed for a failure. Stale or malformed evidence leaves the state unchanged. A dashboard observes but cannot advance the task. Only the task actor’s decision is modeled in the offline example; the VM messages are proposed.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #15263d; }
      .title { font-size: 33px; font-weight: 700; }
      .heading { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #42566c; }
      .kicker { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; fill: #185385; }
      .code { font: 16px Menlo, Consolas, monospace; fill: #134a74; }
      .middle { text-anchor: middle; }
      .panel { fill: #fff; stroke: #acbac7; }
      .app { fill: #eaf6f1; stroke: #86b8a6; }
      .host { fill: #fff5e5; stroke: #cea768; }
      .line { fill: none; stroke: #b1bec9; stroke-dasharray: 4 5; }
      .send, .return { fill: none; stroke: #455d73; stroke-width: 2; marker-end: url(#arrow); }
      .return { stroke-dasharray: 6 4; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#455d73"/>
    </marker>
  </defs>
  <rect width="1200" height="1030" fill="#f7f9fb"/>
  <text x="40" y="38" class="kicker">NORTH-STAR SEQUENCE  /  ONE TEST ATTEMPT  /  LOCAL OR CLOUD</text>
  <text x="40" y="83" class="title">Who can advance a task from Test to Review?</text>
  <text x="40" y="114" class="body">Only the task owner accepts the receipt. The other lanes show the proposed VM protocol, not a live deployment.</text>

  <rect x="40" y="143" width="1120" height="60" rx="9" class="panel"/>
  <text x="56" y="168" class="heading">What is pinned before dispatch?</text>
  <text x="56" y="190" class="body">Workspace, task id + revision, attempt id, check id, executor id + generation, and candidate digest. All must match.</text>

  <g class="middle">
    <rect x="40" y="228" width="172" height="52" rx="8" class="app"/>
    <text x="126" y="260" class="heading">Task owner</text>
    <rect x="257" y="228" width="162" height="52" rx="8" class="panel"/>
    <text x="338" y="260" class="heading">Team</text>
    <rect x="464" y="228" width="176" height="52" rx="8" class="panel"/>
    <text x="552" y="260" class="heading">Test specialist</text>
    <rect x="711" y="228" width="211" height="52" rx="8" class="host"/>
    <text x="816" y="260" class="heading">Trusted executor host</text>
    <rect x="982" y="228" width="178" height="52" rx="8" class="host"/>
    <text x="1071" y="260" class="heading">Guest VM</text>
  </g>
  <path class="line" d="M126 280 V752 M338 280 V752 M552 280 V752 M816 280 V752 M1071 280 V752"/>

  <text x="143" y="306" class="body">Authorize pinned attempt</text>
  <path class="send" d="M126 317 H336"/>
  <text x="355" y="344" class="body">Start fresh session</text>
  <path class="send" d="M338 355 H550"/>
  <text x="568" y="382" class="body">Request the pinned check</text>
  <path class="send" d="M552 393 H814"/>
  <text x="834" y="420" class="body">Run bounded check</text>
  <path class="send" d="M816 431 H1069"/>
  <text x="834" y="458" class="body">Return check result</text>
  <path class="return" d="M1071 469 H818"/>

  <rect x="676" y="487" width="484" height="60" rx="8" class="host"/>
  <text x="692" y="512" class="heading">Host records receipt; connection drops.</text>
  <text x="692" y="535" class="small">The guest finished. The task has not received proof.</text>
  <rect x="40" y="552" width="568" height="66" rx="8" class="app"/>
  <text x="56" y="578" class="code">RECEIPT_TIMEOUT → unknown</text>
  <text x="56" y="602" class="body">Hold this attempt. Neither retry nor dispatch Review.</text>
  <text x="157" y="650" class="body">After reconnection: look up the existing receipt for this attempt. Do not run the check again.</text>
  <path class="send" d="M126 662 H814"/>
  <text x="157" y="703" class="body">HOST_RECEIPT · verified host channel → task owner</text>
  <path class="return" d="M816 716 H128"/>
  <text x="157" y="743" class="small">Without a disconnect, the same receipt can settle the check directly from awaitingReceipt.</text>

  <g transform="translate(40,793)">
    <text class="kicker">TASK DECISION  /  SAME RULE FOR ON-TIME AND LATE EVIDENCE</text>
    <rect y="16" width="353" height="105" rx="9" class="app"/>
    <text x="16" y="44" class="heading">Match + pass</text>
    <text x="16" y="70" class="code">→ reviewReady</text>
    <text x="16" y="99" class="body">May dispatch Review, once.</text>
    <rect x="369" y="16" width="353" height="105" rx="9" class="app"/>
    <text x="385" y="44" class="heading">Match + fail</text>
    <text x="385" y="70" class="code">→ checkFailed</text>
    <text x="385" y="99" class="body">Settled failure. Do not start Review.</text>
    <rect x="738" y="16" width="382" height="105" rx="9" class="panel"/>
    <text x="754" y="44" class="heading">Stale binding or malformed receipt</text>
    <text x="754" y="70" class="code">→ no transition</text>
    <text x="754" y="99" class="body">Keep waiting or stay unknown; do not retry.</text>
  </g>
  <text x="40" y="953" class="body">The dashboard observes the decision. Peer health, guest output and specialist progress are not settlement events.</text>
  <text x="40" y="982" class="small">Offline model: task-check.ts · Receipt authentication, durable storage, reconciliation I/O and Review dispatch belong to future adapters.</text>
</svg>
